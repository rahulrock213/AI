name: Render quiz video

on:
  workflow_dispatch:
    inputs:
      quiz:
        description: "Quiz file to render"
        default: "quizzes/bat_and_ball.json"
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - run: pip install -r requirements.txt
      - run: python make_video.py "${{ inputs.quiz }}"
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-video
          path: build/*.mp4
